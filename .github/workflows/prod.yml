name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to IONOS Production SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SFTP Deploy
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          port: 22
          localDir: '.'
          remoteDir: '/'
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            **/.DS_Store
            HOSTING-NOTES.txt
